<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="/" id="back-button" class="back-button" title="Voltar ao Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
    </a>

    <div id="app">
        <header>
            <h1>Escolha o Tema</h1>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider round"></div>
                </label>
            </div>
        </header>
        <main>
            <section>
                <div style="text-align: center; margin-top: 2rem;">
                    <h2>Escolha a Dificuldade</h2>
                    <div id="difficulty-buttons-container" class="difficulty-buttons-container">
                        <button class="difficulty-button difficulty-button-easy active" data-difficulty="facil">
                            Fácil
                        </button>
                        <button class="difficulty-button difficulty-button-medium" data-difficulty="medio">
                            Médio
                        </button>
                        <button class="difficulty-button difficulty-button-hard" data-difficulty="dificil">
                            Difícil
                        </button>
                        <button class="difficulty-button difficulty-button-random" data-difficulty="aleatorio">
                            Aleatório
                        </button>
                    </div>
                </div>

                <div style="text-align: center; margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
                    <a href="#" style="text-decoration: none;" onclick="event.preventDefault(); goToTopic('0')">
                        <button id="random-questions-button" class="action-button" style="margin-top: 0; width: 100%; min-width: 250px;">
                            Perguntas Aleatórias
                        </button>
                    </a>
                    <a href="#" style="text-decoration: none;" onclick="event.preventDefault(); goToTopic('1')">
                        <button id="cardiology-button" class="action-button" style="margin-top: 0; width: 100%; min-width: 250px;">
                            Cardiologia
                        </button>
                    </a>
                    <a href="#" style="text-decoration: none;" onclick="event.preventDefault(); goToTopic('2')">
                        <button id="cytology-button" class="action-button" style="margin-top: 0; width: 100%; min-width: 250px;">
                            Citologia
                        </button>
                    </a>
                    <a href="#" style="text-decoration: none;" onclick="event.preventDefault(); goToTopic('3')">
                        <button id="nervous-system-button" class="action-button" style="margin-top: 0; width: 100%; min-width: 250px;">
                            Sistema Nervoso
                        </button>
                    </a>
                    <a href="#" style="text-decoration: none;" onclick="event.preventDefault(); goToTopic('4')">
                        <button id="histology-button" class="action-button" style="margin-top: 0; width: 100%; min-width: 250px;">
                            Histologia
                        </button>
                    </a>
                </div>
            </section>
        </main>
    </div>
    <script>
        // Theme switcher functionality
        const checkbox = document.getElementById('checkbox');

        checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
                document.body.classList.add('dark-theme');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark-theme');
                localStorage.setItem('theme', 'light');
            }
        });

        // Load saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            checkbox.checked = true;
            document.body.classList.add('dark-theme');
        }

        // Difficulty buttons functionality
        const difficultyButtons = document.querySelectorAll('.difficulty-button');
        const savedDifficulty = localStorage.getItem('difficulty') || 'facil';

        difficultyButtons.forEach(button => {
            if (button.dataset.difficulty === savedDifficulty) {
                button.classList.add('active');
            } else {
                button.classList.remove('active');
            }
        });

        difficultyButtons.forEach(button => {
            button.addEventListener('click', () => {
                difficultyButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                localStorage.setItem('difficulty', button.dataset.difficulty);
            });
        });

        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode') || 'discursiva';
        const targetPage = mode === 'objetiva' ? '/objetivas' : '/discursivas';

        function goToTopic(topicValue) {    
            localStorage.setItem('topic', topicValue);
            localStorage.setItem('gameMode', mode);
            window.location.href = targetPage;
        }
    </script>
</body>

</html>
