<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div id="app">
        <header style="display: flex;justify-content: space-between;gap: 1rem;align-items: center;text-align: center;margin-bottom: 2rem;border-bottom: 2px solid #FF7F3F;padding-bottom: 1.5rem;">
            <h1>Menu Principal</h1>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider round"></div>
                </label>
            </div>
        </header>
        <img src="../static/logo.jpg" alt="logo" style="display: block; margin: 0 auto; max-width: 33%; height: auto;">
        <main>
            <section>
                <h2 style="text-align: center; padding: 1rem;">Bem-vindo ao Material Digital de Fisiologia</h2>
                <div style="text-align: center; margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
                    <a href="{{ url_for('opcoes_tema') }}?mode=discursiva" style="text-decoration: none;">
                        <button class="action-button" style="margin-top: 0; width: 100%; min-width: 250px; height: 5rem; font-size: medium;">
                            🎮 Jogo das 4 Dicas Discursivas
                        </button>
                    </a>
                    <a href="{{ url_for('opcoes_tema') }}?mode=objetiva" style="text-decoration: none;">
                        <button class="action-button" style="margin-top: 0; width: 100%; min-width: 250px; height: 5rem; font-size: medium;">
                            🎮 Jogo das 4 Dicas Objetivas
                        </button>
                    </a>
                    <!-- <a href="explore.html" style="text-decoration: none;">
                        <button class="action-button" style="margin-top: 0; width: 100%; min-width: 250px; height: 5rem; font-size: medium;">
                            🔍 Explorar Fisiologia
                        </button>
                    </a> -->
                </div>
            </section>
        </main>
    </div>
    <script>
        // Theme switcher functionality
        const checkbox = document.getElementById('checkbox');
        const html = document.documentElement;

        checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
                document.body.classList.add('dark-theme');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark-theme');
                localStorage.setItem('theme', 'light');
            }
        });

        // Load saved theme preference
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            checkbox.checked = true;
            document.body.classList.add('dark-theme');
        }
    </script>
</body>

</html>
