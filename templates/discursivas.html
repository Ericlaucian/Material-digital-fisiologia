<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo das 4 dicas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button href="/" id="back-button" class="back-button" title="Voltar ao Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
    </button>

    <div id="app">

        <header>
            <h2 style="font-size: 1.25rem;">Jogo das 4 dicas</h2>
            <div id="status-bar" class="status-bar">
                <div id="score-display">Score: 0</div>
                <div id="round-progress">Questão: 0/5</div>
            </div>
            <div class="theme-switch-wrapper">
                <!-- <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider round"></div>
                </label> -->
            </div>
        </header>
        <main>
            <section id="topics-section" class="hidden">
                <h2>Escolha um tópico para começar</h2>
                <div id="topics-container"></div>
            </section>
            <section id="roulette-section">
                <!-- <h2 id="perguntas-aleatorias">Perguntas Aleatórias</h2> -->
                <div id="roulette-wheel"></div>
                <button id="spin-button" class="action-button">Girar Roleta</button>            </section>
            <section id="question-section" class="hidden">
                <!-- Top row: small progress, circular score, hints count -->
                <div class="question-top-row" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;">
                    <div id="round-progress-small" class="info-pill">Questão 0/5</div>
                    <div id="question-score" class="score-display" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:50px;min-height:50px;border-radius:50%;">
                        <div style="font-size:.85rem;opacity:.9;">Pontuação</div>
                        <div id="score-large" style="font-size:1.6rem;font-weight:700;">0</div>
                    </div>
                    <div id="hints-count" class="info-pill" style="text-align:center;">4 Dicas</div>
                </div>
 
                <!-- Question card -->
                <div class="question-card">
                    <div class="hint-label">Dica</div>
                    <h3 id="question-title" style="margin: .4rem 0 .2rem 0;font-size:1.25rem;">Pergunta 01</h3>
                    <p id="question-text" style="opacity:.95;font-size:1rem;margin:0;">Texto da pergunta aparecerá aqui.</p>
                </div>

                <!-- Hints area (visual cards where previously options were) -->
                <div id="hints-container" style="display:flex;flex-direction:column;gap:1rem;margin-top:1rem;">
                    <!-- Hint cards will be injected here by JS; styled as large rounded items -->
                </div>

                <!-- Answer area under the hints -->
                <div id="user-answer-container" style="margin-top:1rem;display:flex;flex-direction:column;gap:.5rem;">
                    <textarea id="user-answer-input" placeholder="Escreva sua resposta aqui..." style="min-height:80px;padding:.8rem;border:1px solid #FF7F3F;border-radius:8px;font-size:1rem;resize:none;background:var(--secondary-bg-color);color:var(--text-color);"></textarea>
                    <div style="display:flex;gap:1rem;justify-content:space-between;align-items:center;">
                        <button id="submit-answer-button" class="action-button">Enviar Resposta</button>
                    </div>
                </div>
                <div></div>
                <div id="feedback-message" class="hidden" style="margin:0; margin-top: 1rem;">&nbsp;</div>

                <!-- Controls and auxiliary actions -->
                <div id="hint-timer-controls" style="display:flex;justify-content:center;align-items:center;gap:1rem;margin-top:.6rem;">
                    <button id="next-hint-button" class="action-button">Próxima Dica</button>
                    <button id="answer-now-button" class="action-button">Responder Agora</button>
                </div>

                <div id="answer-container" class="hidden" style="margin-top:1rem;">
                    <p id="answer-text"></p>
                    <div id="correct-wrong-container" class="hidden" style="display:flex;justify-content:center;align-items:center;gap:1rem;margin-top:1rem;">
                        <button id="next-question-button" class="action-button">Próxima Pergunta</button>
                    </div>
                </div>
                <button id="show-answer-button" class="action-button">Mostrar Resposta</button>
                <button id="next-button" class="action-button hidden">Próxima</button>
            </section>
        </main>
    </div>
    <script type="module" src="../public/main.js"></script>
</body>

</html>
